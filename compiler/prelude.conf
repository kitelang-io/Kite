# Kite compiler default prelude (CONFIGURATION, not code).
#
# These standard-library modules are auto-included into every program, like C/C++ default
# availability: [..] list literals (a first-class monomorphized Vec<T>, its RawBuf backing buffer and
# panic funnel pulled in here so a bare `[..]` needs no import), {..} maps, and the built-in nominal
# methods (xs.push(x), s.len(), m.size()) work with no explicit import.
#
# This file is DATA: the compiler has NO hardcoded prelude, it only reads this list of module names.
# Following Kotlin: a list of default-imported stdlib modules, each carrying a type together with its
# convention methods (the desugar landing points), NOT a separate sugar package. The code lives under
# lib/. Change the defaults by editing this list without touching the compiler.
# Lines are kite:: namespace paths; a line whose first non-space char is # is a comment.
kite::core::num
kite::core::panic
kite::alloc::collections::internal::intbuf
kite::alloc::collections::internal::rawmap
kite::alloc::collections::internal::rawbuf
kite::alloc::collections::vec
kite::core::ops
kite::core::cmp
kite::core::hashable
kite::alloc::collections::array
kite::alloc::collections::hashmap
kite::core::string
kite::core::strbuilder
kite::core::option
kite::core::pair
